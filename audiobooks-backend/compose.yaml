services:
  backend:
    build: .
    image: knigaslovo-backend:local
    restart: unless-stopped
    user: "1654:1654"
    ports:
      - "127.0.0.1:${AUDIOBOOK_PORT:-8097}:8080"
    environment:
      AUDIOBOOK_DB: /data/audiobooks-fdb.sqlite
      AUDIOBOOK_CRAWLER_ENABLED: ${AUDIOBOOK_CRAWLER_ENABLED:-true}
      AUDIOBOOK_CRAWLER_PARALLELISM: ${AUDIOBOOK_CRAWLER_PARALLELISM:-1}
      AUDIOBOOK_CRAWLER_INTERVAL_MINUTES: ${AUDIOBOOK_CRAWLER_INTERVAL_MINUTES:-30}
      AUDIOBOOK_DEVKEY: ${AUDIOBOOK_DEVKEY:-}
      AUDIOBOOK_PROXY: ${AUDIOBOOK_PROXY:-}
    volumes:
      - "${AUDIOBOOK_DATA_DIR:-/var/lib/audiobooks-backend/data}:/data"
    mem_limit: 512m
    memswap_limit: 1g
    cpus: "1.0"
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
