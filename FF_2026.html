<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10170e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>Фэнтези Фест 2026 — расписание</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#0d130c;
      --surface:#141d12;
      --surface-2:#1a2517;
      --surface-3:#22301e;
      --text:#f4f7ef;
      --muted:#aeb9a7;
      --line:rgba(255,255,255,.09);
      --accent:#d7ef69;
      --danger:#ff7070;
      --shadow:0 16px 50px rgba(0,0,0,.36);
      --radius:20px;
    }
    *{box-sizing:border-box}
    html{
      scroll-behavior:smooth;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
      background:#0d130c;
    }
    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 15% 0%,rgba(92,130,53,.22),transparent 34rem),
        radial-gradient(circle at 100% 20%,rgba(231,126,48,.10),transparent 28rem),
        linear-gradient(180deg,#10170e 0%,var(--bg) 48%,#091008 100%);
      color:var(--text);
      -webkit-tap-highlight-color:transparent;
      width:100%;
      overflow-x:hidden;
      overscroll-behavior-x:none;
    }
    body::before{
      content:"";
      position:fixed;inset:0;pointer-events:none;opacity:.19;
      background-image:
        linear-gradient(135deg,rgba(255,255,255,.035) 25%,transparent 25%),
        linear-gradient(225deg,rgba(255,255,255,.025) 25%,transparent 25%);
      background-size:28px 28px;
      background-position:0 0,14px 14px;
      mask-image:linear-gradient(to bottom,black,transparent 72%);
    }
    button,input{
      font:inherit;
      -webkit-appearance:none;
      appearance:none;
      border-radius:0;
    }
    button{color:inherit}
    .app{
      width:min(100%,960px);
      margin:0 auto;
      padding-bottom:calc(112px + env(safe-area-inset-bottom));
      overflow:clip;
    }
    .hero{
      position:relative;
      padding:calc(22px + env(safe-area-inset-top)) 18px 14px;
      overflow:hidden;
    }
    .eyebrow{
      display:flex;align-items:center;gap:8px;
      color:#ffad54;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    }
    .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}
    h1{font-size:clamp(30px,8vw,48px);line-height:.98;margin:14px 0 10px;letter-spacing:-.045em}
    .hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;max-width:650px}
    .summary-row{
      display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;
    }
    .summary-card{
      padding:12px 10px;border:1px solid var(--line);border-radius:16px;
      background:rgba(255,255,255,.035);backdrop-filter:blur(14px);
    }
    .summary-card strong{display:block;font-size:20px;letter-spacing:-.03em}
    .summary-card span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
    .control-shell{
      position:sticky;
      top:0;
      z-index:20;
      isolation:isolate;
      padding:8px 12px 10px;
      background:linear-gradient(to bottom,rgba(13,19,12,.97),rgba(13,19,12,.88),transparent);
      backdrop-filter:blur(20px);
    }
    .day-tabs,.view-tabs{
      display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
      padding:5px;border-radius:17px;background:rgba(255,255,255,.055);border:1px solid var(--line);
    }
    .day-tab,.view-tab{
      border:0;background:transparent;padding:10px 6px;border-radius:12px;
      color:var(--muted);font-weight:750;font-size:13px;cursor:pointer;
    }
    .day-tab.active,.view-tab.active{background:var(--surface-3);color:var(--text);box-shadow:0 5px 18px rgba(0,0,0,.22)}
    .tools{display:flex;gap:8px;margin-top:8px}
    .search{
      min-width:0;flex:1;height:44px;padding:0 14px;border-radius:15px;
      font-size:16px;
      background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);outline:none;
    }
    .search:focus{border-color:rgba(215,239,105,.6);box-shadow:0 0 0 3px rgba(215,239,105,.10)}
    .icon-btn{
      width:44px;height:44px;display:grid;place-items:center;flex:0 0 auto;
      border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.05);cursor:pointer;
    }
    .venue-scroller{
      display:flex;gap:8px;overflow-x:auto;padding:10px 18px 3px 2px;scrollbar-width:none;
      scroll-snap-type:x proximity;
      scroll-padding-inline:2px;
      -webkit-overflow-scrolling:touch;
    }
    .venue-scroller::-webkit-scrollbar{display:none}
    .venue-chip{
      white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:8px 11px;
      background:rgba(255,255,255,.035);color:var(--muted);font-size:12px;font-weight:750;cursor:pointer;
      display:flex;align-items:center;gap:7px;
      flex:0 0 auto;
      scroll-snap-align:start;
      min-height:34px;
    }
    .venue-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--venue)}
    .venue-chip.active{color:var(--text);border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.10)}
    @supports (background:color-mix(in srgb,red,blue)){
      .venue-chip.active{border-color:color-mix(in srgb,var(--venue),transparent 35%);background:color-mix(in srgb,var(--venue),transparent 84%)}
    }
    .view-tabs{margin:10px 12px 0;grid-template-columns:repeat(3,1fr)}
    main{padding:14px 12px 0}
    .section-head{
      display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 2px 14px;
    }
    .section-head h2{margin:0;font-size:21px;letter-spacing:-.03em}
    .section-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .counter{font-size:12px;color:var(--muted);white-space:nowrap}
    .timeline{display:flex;flex-direction:column;gap:10px}
    .event-card{
      --venue:#7f8;
      position:relative;display:grid;grid-template-columns:62px minmax(0,1fr) 40px;gap:11px;
      border:1px solid var(--line);border-radius:var(--radius);padding:13px 11px;
      background:linear-gradient(135deg,color-mix(in srgb,var(--venue),transparent 91%),rgba(255,255,255,.032));
      box-shadow:0 9px 32px rgba(0,0,0,.16);overflow:hidden;cursor:pointer;
    }
    .event-card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--venue)}
    .event-card.has-conflict{border-color:rgba(255,112,112,.65);box-shadow:0 0 0 2px rgba(255,112,112,.10),0 9px 32px rgba(0,0,0,.16)}
    .event-time{padding-left:5px}
    .event-time strong{display:block;font-size:15px}
    .event-time span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
    .event-title{font-weight:800;font-size:15px;line-height:1.28;overflow-wrap:anywhere}
    .event-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
    .badge{
      display:inline-flex;align-items:center;gap:6px;max-width:100%;
      border-radius:999px;padding:5px 8px;background:rgba(255,255,255,.06);font-size:10px;color:var(--muted);
    }
    .badge.venue{color:var(--text);background:rgba(255,255,255,.10)}
    @supports (background:color-mix(in srgb,red,blue)){
      .badge.venue{background:color-mix(in srgb,var(--venue),transparent 82%)}
    }
    .badge.conflict{color:#ffd7d7;background:rgba(255,112,112,.15)}
    .save-btn{
      align-self:start;width:38px;height:38px;border-radius:13px;border:1px solid var(--line);
      background:rgba(255,255,255,.04);display:grid;place-items:center;cursor:pointer;font-size:20px;
    }
    .save-btn.saved{background:rgba(215,239,105,.16);border-color:rgba(215,239,105,.42);color:var(--accent)}
    .empty{
      padding:32px 18px;border:1px dashed rgba(255,255,255,.14);border-radius:22px;text-align:center;color:var(--muted);
      background:rgba(255,255,255,.025);
    }
    .overlap-block{
      border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px;background:rgba(255,255,255,.03);
    }
    .overlap-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
    .overlap-time{font-size:17px;font-weight:850}
    .overlap-count{font-size:11px;color:#ffd7d7;padding:6px 9px;border-radius:999px;background:rgba(255,112,112,.14)}
    .overlap-events{display:flex;flex-direction:column;gap:8px}
    .overlap-mini{
      display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;align-items:start;
      padding:10px;border-radius:15px;background:rgba(255,255,255,.035);
    }
    .overlap-mini .bar{height:100%;min-height:36px;border-radius:99px;background:var(--venue)}
    .overlap-mini strong{display:block;font-size:13px;line-height:1.3}
    .overlap-mini span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
    .saved-actions{display:flex;gap:8px;margin:0 0 14px}
    .primary-btn,.secondary-btn{
      border:0;border-radius:15px;padding:11px 14px;font-weight:800;cursor:pointer;
    }
    .primary-btn{background:var(--accent);color:#18200e}
    .secondary-btn{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line)}
    .bottom-nav{
      position:fixed;z-index:30;left:50%;bottom:max(10px,env(safe-area-inset-bottom));
      transform:translateX(-50%);width:min(calc(100% - 20px),660px);
      border:1px solid var(--line);border-radius:22px;padding:7px;
      background:rgba(21,30,18,.91);backdrop-filter:blur(22px);box-shadow:var(--shadow);
      display:grid;grid-template-columns:repeat(3,1fr);gap:5px;
    }
    .bottom-nav button{
      border:0;border-radius:15px;background:transparent;color:var(--muted);padding:9px 6px;font-size:11px;font-weight:800;cursor:pointer;
    }
    .bottom-nav button span{display:block;font-size:19px;line-height:1;margin-bottom:4px}
    .bottom-nav button.active{background:rgba(255,255,255,.075);color:var(--text)}
    .sheet-backdrop{
      position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:.2s;
    }
    .sheet{
      position:fixed;z-index:51;left:50%;bottom:0;transform:translate(-50%,105%);
      width:min(100%,680px);border-radius:28px 28px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));
      background:#172015;border:1px solid var(--line);box-shadow:var(--shadow);transition:.24s ease;
    }
    .sheet.open{transform:translate(-50%,0)}
    .sheet-backdrop.open{opacity:1;pointer-events:auto}
    .grabber{width:42px;height:5px;border-radius:99px;background:rgba(255,255,255,.2);margin:0 auto 18px}
    .sheet-label{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:6px 9px;margin-bottom:12px}
    .sheet h3{margin:0;font-size:23px;line-height:1.16;letter-spacing:-.035em}
    .sheet-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}
    .sheet-info div{padding:11px;border-radius:15px;background:rgba(255,255,255,.045)}
    .sheet-info span{display:block;color:var(--muted);font-size:10px}
    .sheet-info strong{display:block;margin-top:4px;font-size:13px}
    .sheet .primary-btn{width:100%}
    .toast{
      position:fixed;z-index:80;left:50%;bottom:100px;transform:translate(-50%,16px);
      opacity:0;pointer-events:none;padding:10px 14px;border-radius:14px;background:#edf6dd;color:#16200f;
      font-size:12px;font-weight:800;transition:.2s;box-shadow:var(--shadow);white-space:nowrap;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media (max-width:520px){
      :root{--radius:17px}
      .app{padding-bottom:calc(108px + env(safe-area-inset-bottom))}
      .hero{padding:calc(16px + env(safe-area-inset-top)) 12px 11px}
      .eyebrow{font-size:10px;letter-spacing:.1em}
      h1{font-size:34px;margin:11px 0 8px}
      .hero p{font-size:12px;line-height:1.42}
      .summary-row{gap:6px;margin-top:13px}
      .summary-card{padding:9px 8px;border-radius:13px}
      .summary-card strong{font-size:17px}
      .summary-card span{font-size:9px}

      .control-shell{padding:7px 9px 9px}
      .day-tabs,.view-tabs{gap:4px;padding:4px;border-radius:15px}
      .day-tab,.view-tab{min-width:0;min-height:38px;padding:8px 3px;border-radius:11px;font-size:12px;line-height:1.1}
      .tools{gap:6px;margin-top:7px}
      .search{height:42px;padding:0 11px;border-radius:13px}
      .icon-btn{width:42px;height:42px;border-radius:13px}
      .venue-scroller{gap:6px;padding-top:8px;padding-bottom:1px}
      .venue-chip{padding:6px 9px;font-size:11px;min-height:31px}
      .venue-chip .dot{width:7px;height:7px}
      .view-tabs{margin:8px 9px 0}

      main{padding:11px 8px 0}
      .section-head{align-items:flex-start;gap:8px;margin:3px 2px 10px}
      .section-head h2{font-size:18px;line-height:1.1}
      .section-head p{font-size:10px;line-height:1.3;margin-top:3px}
      .counter{font-size:10px;padding-top:2px}
      .timeline{gap:8px}

      .event-card{
        grid-template-columns:52px minmax(0,1fr) 34px;
        gap:8px;
        padding:11px 8px;
        min-width:0;
        border-radius:17px;
        background:rgba(255,255,255,.038);
        background:linear-gradient(135deg,color-mix(in srgb,var(--venue),transparent 92%),rgba(255,255,255,.032));
      }
      .event-card::before{width:3px}
      .event-time{padding-left:3px;min-width:0}
      .event-time strong{font-size:14px;line-height:1.05}
      .event-time span{font-size:9px;margin-top:4px;white-space:nowrap}
      .event-title{
        font-size:14px;
        line-height:1.24;
        font-weight:780;
        letter-spacing:-.012em;
        display:-webkit-box;
        -webkit-box-orient:vertical;
        -webkit-line-clamp:3;
        overflow:hidden;
      }
      .event-meta{gap:4px;margin-top:7px}
      .badge{padding:4px 6px;font-size:9px;line-height:1.1}
      .save-btn{width:34px;height:34px;border-radius:11px;font-size:18px;padding:0}

      .overlap-block{padding:11px;border-radius:17px;margin-bottom:9px}
      .overlap-head{margin-bottom:8px}
      .overlap-time{font-size:15px}
      .overlap-count{font-size:9px;padding:5px 7px}
      .overlap-mini{padding:8px;border-radius:13px}
      .overlap-mini strong{font-size:12px}
      .overlap-mini span{font-size:10px}

      .bottom-nav{
        width:calc(100% - 14px);
        bottom:max(6px,env(safe-area-inset-bottom));
        padding:5px;
        border-radius:18px;
      }
      .bottom-nav button{min-width:0;padding:8px 2px;font-size:9px;border-radius:13px;line-height:1.1}
      .bottom-nav button span{font-size:17px;margin-bottom:3px}

      .sheet{padding:9px 14px calc(18px + env(safe-area-inset-bottom));border-radius:23px 23px 0 0}
      .sheet h3{font-size:20px;line-height:1.18}
      .sheet-info{gap:6px;margin:14px 0}
      .sheet-info div{padding:9px;border-radius:13px}
      .toast{bottom:88px;max-width:calc(100% - 28px);white-space:normal;text-align:center}
    }
    @media (max-width:365px){
      .event-card{grid-template-columns:48px minmax(0,1fr) 32px;gap:6px;padding:10px 7px}
      .event-title{font-size:13px;-webkit-line-clamp:3}
      .event-time strong{font-size:13px}
      .save-btn{width:32px;height:32px;font-size:17px}
      .badge{font-size:8.5px;padding:4px 5px}
      .venue-chip{font-size:10.5px;padding-inline:8px}
      .bottom-nav button{font-size:8.5px}
    }
    @media (min-width:760px){
      .hero{padding-left:24px;padding-right:24px}
      .control-shell{padding-left:20px;padding-right:20px}
      main{padding-left:20px;padding-right:20px}
      .timeline{display:grid;grid-template-columns:1fr 1fr}
      .event-card{min-height:124px}
      .overlap-events{display:grid;grid-template-columns:1fr 1fr}
      .summary-row{width:560px}
    }
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="eyebrow">31 июля — 2 августа 2026</div>
    <h1>Фэнтези Фест</h1>
    <p>Мобильное расписание шести площадок. Сохраняйте выступления и сразу проверяйте пересечения.</p>
    <div class="summary-row">
      <div class="summary-card"><strong id="totalStat">113</strong><span>событий</span></div>
      <div class="summary-card"><strong>6</strong><span>площадок</span></div>
      <div class="summary-card"><strong id="savedStat">0</strong><span>сохранено</span></div>
    </div>
  </header>

  <section class="control-shell">
    <div class="day-tabs" id="dayTabs"></div>
    <div class="tools">
      <input class="search" id="searchInput" type="search" placeholder="Поиск группы, автора или темы">
      <button class="icon-btn" id="clearBtn" aria-label="Сбросить фильтры" title="Сбросить фильтры">↺</button>
    </div>
    <div class="venue-scroller" id="venueFilters"></div>
  </section>

  <div class="view-tabs" id="viewTabs">
    <button class="view-tab active" data-view="schedule">Расписание</button>
    <button class="view-tab" data-view="overlaps">Пересечения</button>
    <button class="view-tab" data-view="saved">Мой маршрут</button>
  </div>

  <main id="main"></main>
</div>

<nav class="bottom-nav">
  <button class="active" data-view="schedule"><span>▦</span>Расписание</button>
  <button data-view="overlaps"><span>⇄</span>Пересечения</button>
  <button data-view="saved"><span>★</span>Мой маршрут</button>
</nav>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<aside class="sheet" id="sheet" aria-modal="true" role="dialog"></aside>
<div class="toast" id="toast"></div>

T22:00:00","day":"2026-08-02"},{"id":"5e99ce69-d334-51d2-b261-0c5dff5f893b@fantasyfest2026.local","title":"Мечтатель","venue":"Сцена «Круг Света»","start":"2026-08-02T21:00:00","end":"2026-08-02T22:00:00","day":"2026-08-02"}];
const VENUE_COLORS = {"Сцена «Круг Света»": "#5B8CFF", "Сцена «Берег»": "#55C97A", "Сцена «Былина»": "#B77CFF", "Лекторий": "#F2C14E", "Литературная программа": "#FF7A8A", "Ристалище": "#35C5C2"};
const VENUE_ORDER = ["Сцена «Круг Света»", "Сцена «Берег»", "Сцена «Былина»", "Лекторий", "Литературная программа", "Ристалище"];
const DAYS = [
  {id:"2026-07-31",short:"31 июля",long:"Пятница, 31 июля"},
  {id:"2026-08-01",short:"1 августа",long:"Суббота, 1 августа"},
  {id:"2026-08-02",short:"2 августа",long:"Воскресенье, 2 августа"}
];

const state = {
  day:DAYS[0].id,
  view:"schedule",
  venues:new Set(VENUE_ORDER),
  query:"",
  saved:new Set(JSON.parse(localStorage.getItem("ff26-saved") || "[]"))
};

const $ = s => document.querySelector(s);
const main = $("#main");
const dayTabs = $("#dayTabs");
const venueFilters = $("#venueFilters");
const searchInput = $("#searchInput");
const sheet = $("#sheet");
const sheetBackdrop = $("#sheetBackdrop");
const toast = $("#toast");

function minutes(iso){
  const d=new Date(iso);
  return d.getHours()*60+d.getMinutes();
}
function fmtTime(iso){
  return new Date(iso).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
}
function duration(event){
  const n=(new Date(event.end)-new Date(event.start))/60000;
  const h=Math.floor(n/60),m=n%60;
  return h ? `${h} ч${m?` ${m} мин`:""}` : `${m} мин`;
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function color(venue){ return VENUE_COLORS[venue] || "#999"; }
function shortVenue(venue){
  return venue.replace("Сцена ","").replaceAll("«","").replaceAll("»","");
}
function visibleBase(){
  const q=state.query.trim().toLocaleLowerCase("ru");
  return EVENTS.filter(e=>
    e.day===state.day &&
    state.venues.has(e.venue) &&
    (!q || `${e.title} ${e.venue}`.toLocaleLowerCase("ru").includes(q))
  );
}
function allDayEvents(){
  return EVENTS.filter(e=>e.day===state.day);
}
function overlaps(a,b){
  return new Date(a.start)<new Date(b.end) && new Date(b.start)<new Date(a.end);
}
function conflictCount(event, pool=allDayEvents()){
  return pool.filter(other=>other.id!==event.id && overlaps(event,other)).length;
}
function selectedConflicts(){
  const selected=EVENTS.filter(e=>state.saved.has(e.id));
  const ids=new Set();
  for(let i=0;i<selected.length;i++) for(let j=i+1;j<selected.length;j++){
    if(selected[i].day===selected[j].day && overlaps(selected[i],selected[j])){
      ids.add(selected[i].id);ids.add(selected[j].id);
    }
  }
  return ids;
}
function eventCard(e, selectedConflictIds=new Set()){
  const n=conflictCount(e);
  const saved=state.saved.has(e.id);
  return `
    <article class="event-card ${selectedConflictIds.has(e.id)?"has-conflict":""}" style="--venue:${color(e.venue)}" data-event="${esc(e.id)}">
      <div class="event-time"><strong>${fmtTime(e.start)}</strong><span>до ${fmtTime(e.end)}</span></div>
      <div>
        <div class="event-title">${esc(e.title)}</div>
        <div class="event-meta">
          <span class="badge venue">${esc(shortVenue(e.venue))}</span>
          <span class="badge">${duration(e)}</span>
          ${n?`<span class="badge conflict">${n} пересеч.</span>`:""}
        </div>
      </div>
      <button class="save-btn ${saved?"saved":""}" data-save="${esc(e.id)}" aria-label="${saved?"Убрать из маршрута":"Сохранить в маршрут"}">${saved?"★":"☆"}</button>
    </article>`;
}
function renderDays(){
  dayTabs.innerHTML=DAYS.map(d=>`<button class="day-tab ${state.day===d.id?"active":""}" data-day="${d.id}">${d.short}</button>`).join("");
}
function renderVenues(){
  venueFilters.innerHTML=VENUE_ORDER.map(v=>`
    <button class="venue-chip ${state.venues.has(v)?"active":""}" data-venue="${esc(v)}" style="--venue:${color(v)}">
      <span class="dot"></span>${esc(shortVenue(v))}
    </button>`).join("");
}
function syncViewButtons(){
  document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===state.view));
}
function renderSchedule(){
  const data=visibleBase();
  const day=DAYS.find(d=>d.id===state.day);
  main.innerHTML=`
    <div class="section-head">
      <div><h2>${day.long}</h2><p>Сначала название события, затем площадка</p></div>
      <div class="counter">${data.length} из ${allDayEvents().length}</div>
    </div>
    <div class="timeline">${data.length?data.map(e=>eventCard(e)).join(""):`<div class="empty">По выбранным фильтрам событий нет.</div>`}</div>`;
}
function overlapSlices(events){
  const points=[...new Set(events.flatMap(e=>[minutes(e.start),minutes(e.end)]))].sort((a,b)=>a-b);
  const slices=[];
  for(let i=0;i<points.length-1;i++){
    const start=points[i],end=points[i+1];
    const active=events.filter(e=>minutes(e.start)<end && minutes(e.end)>start);
    if(active.length>1){
      const key=active.map(e=>e.id).sort().join("|");
      const prev=slices.at(-1);
      if(prev && prev.key===key && prev.end===start) prev.end=end;
      else slices.push({start,end,active,key});
    }
  }
  return slices;
}
function hm(mins){return `${String(Math.floor(mins/60)).padStart(2,"0")}:${String(mins%60).padStart(2,"0")}`}
function renderOverlaps(){
  const data=visibleBase();
  const slices=overlapSlices(data);
  main.innerHTML=`
    <div class="section-head">
      <div><h2>Одновременные события</h2><p>Точные интервалы, когда идут два события и более</p></div>
      <div class="counter">${slices.length} интервалов</div>
    </div>
    ${slices.length?slices.map(s=>`
      <section class="overlap-block">
        <div class="overlap-head">
          <div class="overlap-time">${hm(s.start)}–${hm(s.end)}</div>
          <div class="overlap-count">${s.active.length} одновременно</div>
        </div>
        <div class="overlap-events">
          ${s.active.map(e=>`
            <div class="overlap-mini" style="--venue:${color(e.venue)}" data-event="${esc(e.id)}">
              <div class="bar"></div>
              <div><strong>${esc(e.title)}</strong><span>${esc(shortVenue(e.venue))} · ${fmtTime(e.start)}–${fmtTime(e.end)}</span></div>
            </div>`).join("")}
        </div>
      </section>`).join(""):`<div class="empty">Для выбранных площадок пересечений нет.</div>`}`;
}
function renderSaved(){
  const selected=EVENTS.filter(e=>state.saved.has(e.id)).sort((a,b)=>a.start.localeCompare(b.start));
  const conflicts=selectedConflicts();
  $("#savedStat").textContent=selected.length;
  main.innerHTML=`
    <div class="section-head">
      <div><h2>Мой маршрут</h2><p>${conflicts.size?`Конфликтуют ${conflicts.size} сохранённых событий`:"Пересечений среди выбранного нет"}</p></div>
      <div class="counter">${selected.length} сохранено</div>
    </div>
    ${selected.length?`
      <div class="saved-actions">
        <button class="primary-btn" id="downloadIcs">Скачать мой маршрут</button>
        <button class="secondary-btn" id="clearSaved">Очистить</button>
      </div>
      ${DAYS.map(d=>{
        const items=selected.filter(e=>e.day===d.id);
        return items.length?`<section style="margin-bottom:20px"><div class="section-head"><div><h2 style="font-size:17px">${d.long}</h2></div><div class="counter">${items.length}</div></div><div class="timeline">${items.map(e=>eventCard(e,conflicts)).join("")}</div></section>`:"";
      }).join("")}
    `:`<div class="empty">Нажмите ☆ у события, чтобы собрать личный маршрут и проверить пересечения.</div>`}`;
}
function render(){
  renderDays();renderVenues();syncViewButtons();
  if(state.view==="schedule")renderSchedule();
  if(state.view==="overlaps")renderOverlaps();
  if(state.view==="saved")renderSaved();
  $("#savedStat").textContent=state.saved.size;
}
function saveState(){
  localStorage.setItem("ff26-saved",JSON.stringify([...state.saved]));
}
function notify(text){
  toast.textContent=text;toast.classList.add("show");
  clearTimeout(notify.t);notify.t=setTimeout(()=>toast.classList.remove("show"),1500);
}
function toggleSave(id){
  if(state.saved.has(id)){state.saved.delete(id);notify("Удалено из маршрута")}
  else{state.saved.add(id);notify("Добавлено в маршрут")}
  saveState();render();
}
function showEvent(id){
  const e=EVENTS.find(x=>x.id===id);if(!e)return;
  const n=conflictCount(e);
  sheet.innerHTML=`
    <div class="grabber"></div>
    <span class="sheet-label" style="color:${color(e.venue)};background:color-mix(in srgb,${color(e.venue)},transparent 84%)">${esc(e.venue)}</span>
    <h3>${esc(e.title)}</h3>
    <div class="sheet-info">
      <div><span>Время</span><strong>${fmtTime(e.start)}–${fmtTime(e.end)}</strong></div>
      <div><span>Продолжительность</span><strong>${duration(e)}</strong></div>
      <div><span>Дата</span><strong>${DAYS.find(d=>d.id===e.day).short}</strong></div>
      <div><span>Пересечения</span><strong>${n?`${n} событий`:"Нет"}</strong></div>
    </div>
    <button class="primary-btn" data-save="${esc(e.id)}">${state.saved.has(e.id)?"Убрать из маршрута":"Добавить в маршрут"}</button>`;
  sheet.classList.add("open");sheetBackdrop.classList.add("open");
}
function closeSheet(){sheet.classList.remove("open");sheetBackdrop.classList.remove("open")}
function downloadSelectedIcs(){
  const selected=EVENTS.filter(e=>state.saved.has(e.id)).sort((a,b)=>a.start.localeCompare(b.start));
  const pad=n=>String(n).padStart(2,"0");
  const dt=iso=>{const d=new Date(iso);return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`};
  const ie=s=>s.replaceAll("\\","\\\\").replaceAll("\n","\\n").replaceAll(",","\\,").replaceAll(";","\\;");
  let ics=["BEGIN:VCALENDAR","VERSION:2.0","CALSCALE:GREGORIAN","PRODID:-//Fantasy Fest Route//RU","X-WR-CALNAME:Мой маршрут — Фэнтези Фест 2026","X-WR-TIMEZONE:Europe/Moscow"];
  selected.forEach(e=>ics.push("BEGIN:VEVENT",`UID:${e.id}`,`DTSTART;TZID=Europe/Moscow:${dt(e.start)}`,`DTEND;TZID=Europe/Moscow:${dt(e.end)}`,`SUMMARY:${ie(e.title+" — "+e.venue)}`,`LOCATION:${ie(e.venue)}`,"END:VEVENT"));
  ics.push("END:VCALENDAR");
  const blob=new Blob([ics.join("\r\n")],{type:"text/calendar;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Мой_маршрут_Фэнтези_Фест_2026.ics";a.click();URL.revokeObjectURL(a.href);
}
document.addEventListener("click",e=>{
  const day=e.target.closest("[data-day]");if(day){state.day=day.dataset.day;render();return}
  const view=e.target.closest("[data-view]");if(view){state.view=view.dataset.view;render();window.scrollTo({top:0,behavior:"smooth"});return}
  const venue=e.target.closest("[data-venue]");if(venue){
    const v=venue.dataset.venue;state.venues.has(v)?state.venues.delete(v):state.venues.add(v);render();return
  }
  const save=e.target.closest("[data-save]");if(save){e.stopPropagation();toggleSave(save.dataset.save);closeSheet();return}
  const card=e.target.closest("[data-event]");if(card){showEvent(card.dataset.event);return}
  if(e.target.id==="downloadIcs"){downloadSelectedIcs();return}
  if(e.target.id==="clearSaved"){state.saved.clear();saveState();render();notify("Маршрут очищен")}
});
searchInput.addEventListener("input",e=>{state.query=e.target.value;render()});
$("#clearBtn").addEventListener("click",()=>{state.query="";searchInput.value="";state.venues=new Set(VENUE_ORDER);render()});
sheetBackdrop.addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
render();
</script>
</body>
