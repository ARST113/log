<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d130c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>Фэнтези Фест 2026 — расписание</title>
  <link rel="stylesheet" href="ff2026.css?v=7">
  <link rel="stylesheet" href="ff2026-ios-fix.css?v=7">
  <link rel="stylesheet" href="ff2026-vk.css?v=4">
  <link rel="stylesheet" href="ff2026-yandex.css?v=3">
  <link rel="stylesheet" href="ff2026-map.css?v=1">
  <link rel="stylesheet" href="ff2026-map-v3.css?v=3">
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="eyebrow">31 июля — 2 августа 2026</div>
    <h1>Фэнтези Фест</h1>
    <p>Мобильное расписание шести площадок. Сохраняйте выступления и сразу проверяйте пересечения.</p>
    <div class="summary-row">
      <div class="summary-card"><strong id="totalStat">113</strong><span>событий</span></div>
      <div class="summary-card"><strong>6</strong><span>площадок</span></div>
      <div class="summary-card"><strong id="savedStat">0</strong><span>сохранено</span></div>
    </div>
  </header>

  <section class="control-shell">
    <div class="day-tabs" id="dayTabs"></div>
    <div class="tools">
      <input class="search" id="searchInput" type="search" placeholder="Поиск группы, автора или темы">
      <button class="icon-btn" id="clearBtn" aria-label="Сбросить фильтры" title="Сбросить фильтры">↺</button>
    </div>
    <div class="venue-scroller" id="venueFilters"></div>
  </section>

  <div class="view-tabs" id="viewTabs">
    <button class="view-tab active" data-view="schedule">Расписание</button>
    <button class="view-tab" data-view="overlaps">Пересечения</button>
    <button class="view-tab" data-view="saved">Мой маршрут</button>
  </div>

  <main id="main"></main>
</div>

<nav class="bottom-nav">
  <button class="active" data-view="schedule"><span>▦</span>Расписание</button>
  <button data-view="overlaps"><span>⇄</span>Пересечения</button>
  <button data-view="saved"><span>★</span>Мой маршрут</button>
</nav>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<aside class="sheet" id="sheet" aria-modal="true" role="dialog"></aside>
<div class="toast" id="toast"></div>

<script src="ff2026-data-1.js?v=7"></script>
<script src="ff2026-data-2.js?v=7"></script>
<script src="ff2026-data-3.js?v=7"></script>
<script src="ff2026-data-4.js?v=7"></script>
<script src="ff2026-data-5.js?v=7"></script>
<script src="ff2026-data-6.js?v=7"></script>
<script src="ff2026-vk.js?v=2"></script>
<script src="ff2026-vk-extra.js?v=5"></script>
<script src="ff2026-yandex-loader.js?v=1"></script>
<script src="ff2026-app.js?v=7"></script>
<script src="ff2026-vk-ui.js?v=5"></script>
<script src="ff2026-yandex-ui.js?v=5"></script>
<script src="ff2026-map-v3.js?v=3"></script>
</body>
</html>
