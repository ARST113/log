plugins { id 'com.android.application' }

android {
    namespace 'org.arst113.mtsdebug'
    compileSdk 35

    defaultConfig {
        applicationId 'org.arst113.mtsadb.fix051'
        minSdk 23
        targetSdk 32
        versionCode 6
        versionName '0.5.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField 'String', 'OPENROUTER_API_KEY', '\"' + (System.getenv('MTS_OPENROUTER_API_KEY') ?: '') + '\"'
    }

    buildTypes {
        release { minifyEnabled false }
    }
}
