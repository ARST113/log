plugins { id 'com.android.application' }

android {
    namespace 'org.arst113.mtsdebug'
    compileSdk 35

    defaultConfig {
        applicationId 'org.arst113.mtsdebug'
        minSdk 23
        targetSdk 32
        versionCode 3
        versionName '0.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release { minifyEnabled false }
    }
}
