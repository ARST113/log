name: Apply ContinueWatching v5.7 timeline direct

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-continuewatch-v57-timeline-direct.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Timeline-direct ContinueWatching
        run: python3 scripts/patch_continuewatch_v57_timeline_direct.py

      - name: Syntax check
        run: node --check ContinueWatching.js

      - name: Publish cache-safe copy
        run: cp ContinueWatching.js ContinueWatching-v5.7.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ContinueWatching.js ContinueWatching-v5.7.js
          git commit -m "Restore Timeline-direct online resume and keep Just+ return" || exit 0
          git push
