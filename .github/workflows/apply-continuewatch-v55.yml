name: Apply ContinueWatching v5.5 online resume

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-continuewatch-v55.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch ContinueWatching
        run: python3 scripts/patch_continuewatch_v55.py

      - name: Syntax check
        run: node --check ContinueWatching.js

      - name: Publish cache-safe copy
        run: cp ContinueWatching.js ContinueWatching-v5.5.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ContinueWatching.js ContinueWatching-v5.5.js
          git commit -m "Fix ContinueWatching online URL restore and routing" || exit 0
          git push
