name: Apply ContinueWatching v5.6.1 desktop UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-continuewatch-v561-desktop.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch ContinueWatching desktop UI
        run: python3 scripts/patch_continuewatch_v561_desktop_ui.py

      - name: Syntax check
        run: node --check ContinueWatching.js

      - name: Publish cache-safe copy
        run: cp ContinueWatching.js ContinueWatching-v5.6.1.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ContinueWatching.js ContinueWatching-v5.6.1.js
          git commit -m "Fix ContinueWatching desktop click and focus handling" || exit 0
          git push
