name: Apply ContinueWatching v5.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-continuewatch-v53.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Relax cleanup replacement guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch_continuewatch_v53.py')
          s = p.read_text(encoding='utf-8')
          old = """    if count != 1:\n        raise SystemExit(f'{label}: expected 1 occurrence, got {count}')\n    s = s.replace(old, new, 1)\n"""
          new = """    if count < 1:\n        raise SystemExit(f'{label}: expected at least 1 occurrence, got {count}')\n    if count > 1 and label != 'skip pointers in cleanup':\n        raise SystemExit(f'{label}: expected 1 occurrence, got {count}')\n    s = s.replace(old, new, 1)\n"""
          if old not in s:
              raise SystemExit('replace_once helper not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Patch ContinueWatching
        run: python3 scripts/patch_continuewatch_v53.py

      - name: Syntax check
        run: node --check ContinueWatching.js

      - name: Publish cache-safe copy
        run: cp ContinueWatching.js ContinueWatching-v5.3.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ContinueWatching.js ContinueWatching-v5.3.js
          git commit -m "Fix ContinueWatching playlist sync and torrent player routing" || exit 0
          git push
