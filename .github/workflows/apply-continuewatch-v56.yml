name: Apply ContinueWatching v5.6 online resolver

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-continuewatch-v56.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update patch guard
        run: |
          sed -i "s/strict card identity + profile isolated sync initialized/strict identity + online\/torrent resume routing initialized/" scripts/patch_continuewatch_v56.py

      - name: Patch ContinueWatching
        run: python3 scripts/patch_continuewatch_v56.py

      - name: Syntax check
        run: node --check ContinueWatching.js

      - name: Publish cache-safe copy
        run: cp ContinueWatching.js ContinueWatching-v5.6.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ContinueWatching.js ContinueWatching-v5.6.js
          git commit -m "Fix online resume by re-resolving fresh stream URLs" || exit 0
          git push
