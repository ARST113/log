name: Publish MTS ADB Auto 0.5.1 prerelease

on:
  push:
    branches: [mts-debug-suite]
    paths: [".github/workflows/release-mts-adb-auto-0.5.1.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout compiled APK
        uses: actions/checkout@v4
      - name: Verify build and prepare asset
        run: |
          test -s m.apk
          sha256sum -c m.apk.sha256
          cp m.apk MTS-ADB-Auto-v0.5.1.apk
          sha256sum MTS-ADB-Auto-v0.5.1.apk > MTS-ADB-Auto-v0.5.1.apk.sha256
          file MTS-ADB-Auto-v0.5.1.apk
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view mts-adb-auto-v0.5.1 >/dev/null 2>&1; then
            echo "Pre-release exists."
            exit 0
          fi
          gh release create mts-adb-auto-v0.5.1 \
            MTS-ADB-Auto-v0.5.1.apk \
            MTS-ADB-Auto-v0.5.1.apk.sha256 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "MTS ADB Auto 0.5.1 — исправлен запуск КИОН" \
            --notes "Тестовый APK для Android TV, исправлена ошибочная переадресация на КИОН при автоподборе. Приоритет: com.android.settings.DevelopmentSettings — компонент, найденный в оригинальной Developer Options Shortcut 1.058. Допущены только системные экраны разработчика; журнал сохраняется после перезапуска. Не требует установки исходных приложений. ADB может оставаться заблокированным прошивкой. OpenRouter в этой сборке пока не активирован." \
            --prerelease
