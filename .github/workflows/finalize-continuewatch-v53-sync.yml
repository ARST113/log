name: Finalize ContinueWatching v5.3 sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-continuewatch-v53-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force post-load compact sync rewrite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ContinueWatching.js')
          s = p.read_text(encoding='utf-8')
          old = """        function migrateCompactStorage() {\n            var params = getParams();\n"""
          new = """        function migrateCompactStorage(forceWrite) {\n            var params = getParams();\n"""
          if s.count(old) != 1:
              raise SystemExit('migrate signature mismatch')
          s = s.replace(old, new, 1)
          old2 = """            if (changed) setParams(params, true);\n            return changed;\n        }\n\n        function updateLastPointer"""
          new2 = """            if (changed || forceWrite) setParams(params, true);\n            return changed;\n        }\n\n        function updateLastPointer"""
          if s.count(old2) != 1:
              raise SystemExit('migrate write mismatch')
          s = s.replace(old2, new2, 1)
          old3 = """            setTimeout(function () {\n                StorageManager.migrateCompactStorage();\n            }, 16000);\n"""
          new3 = """            setTimeout(function () {\n                StorageManager.migrateCompactStorage(true);\n            }, 16000);\n"""
          if s.count(old3) != 1:
              raise SystemExit('second migration timer mismatch')
          s = s.replace(old3, new3, 1)
          p.write_text(s, encoding='utf-8')
          Path('ContinueWatching-v5.3.js').write_text(s, encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check ContinueWatching.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ContinueWatching.js ContinueWatching-v5.3.js
          git commit -m "Finalize ContinueWatching compact playlist sync" || exit 0
          git push
