name: Inspect HistoryRussia viewer

on:
  push:
    branches:
      - research/kazan-books-1940s
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public viewer HTML and JS references
        run: |
          set -euo pipefail
          mkdir -p hr_viewer
          python - <<'PY'
          import re, json, requests
          from pathlib import Path
          from urllib.parse import urljoin
          url='https://docs.historyrussia.org/ru/nodes/250598'
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 Chrome/150 Safari/537.36'
          r=s.get(url,timeout=60); print('PAGE',r.status_code,r.url,r.headers.get('content-type'),len(r.content)); r.raise_for_status()
          Path('hr_viewer/page.html').write_bytes(r.content)
          html=r.text
          urls=[]
          for m in re.findall(r'''(?:src|href)=["']([^"']+)["']''',html):
              u=urljoin(r.url,m)
              if u not in urls: urls.append(u)
          Path('hr_viewer/assets.txt').write_text('\n'.join(urls),encoding='utf-8')
          pats=['viewer','image','page','document','scan','zoom','tile','iiif','leaflet','openseadragon','114','45']
          hits=[]
          for i,line in enumerate(html.splitlines(),1):
              if any(p.lower() in line.lower() for p in pats): hits.append(f'{i}: {line[:2000]}')
          Path('hr_viewer/html_hits.txt').write_text('\n'.join(hits),encoding='utf-8')
          js=[u for u in urls if '.js' in u.split('?')[0]]
          print('ASSETS',len(urls),'JS',len(js))
          jhits=[]
          for j,u in enumerate(js[:40],1):
              try:
                  q=s.get(u,timeout=60); print('JS',j,q.status_code,len(q.content),u)
                  if not q.ok: continue
                  text=q.text
                  Path(f'hr_viewer/js_{j:02d}.js').write_text(text,encoding='utf-8',errors='ignore')
                  for pat in [r'https?://[^"\'\s]+',r'/[^"\'\s]*(?:image|page|scan|tile|viewer|document)[^"\'\s]*']:
                      for m in re.findall(pat,text,re.I):
                          if m not in jhits: jhits.append(m)
              except Exception as e: print('ERR',u,e)
          Path('hr_viewer/js_candidate_urls.txt').write_text('\n'.join(jhits),encoding='utf-8')
          print('CANDIDATES',len(jhits))
          print('\n'.join(jhits[:100]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: historyrussia-viewer-inspection
          path: hr_viewer/
          retention-days: 30
