name: Apply ContinueWatching v5.8 resolver

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-continuewatch-v58-resolver.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply resolver patch
        run: python3 scripts/patch_continuewatch_v58_resolver.py

      - name: Syntax check
        run: node --check ContinueWatching.js

      - name: Publish cache-safe copy
        run: cp ContinueWatching.js ContinueWatching-v5.8.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ContinueWatching.js ContinueWatching-v5.8.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix online continue with fresh Lampac resolver URL"
          git push
