name: Build MTS Debug Toolbox APK

on:
  push:
    branches: [mts-debug-suite]
    paths:
      - "android-tools/mts-debug-suite/**"
      - ".github/workflows/mts-debug-suite.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: android-tools/mts-debug-suite
        run: gradle --no-daemon assembleDebug
      - name: Save downloadable APK
        run: |
          cp android-tools/mts-debug-suite/app/build/outputs/apk/debug/app-debug.apk m.apk
          sha256sum m.apk | tee m.apk.sha256
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTS-Debug-Toolbox
          path: |
            m.apk
            m.apk.sha256
          if-no-files-found: error
      - name: Publish APK to branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add m.apk m.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Publish MTS Debug Toolbox APK [skip ci]"
            git push origin HEAD:mts-debug-suite
          fi
