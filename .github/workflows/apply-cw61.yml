name: Apply ContinueWatching v6.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cw61.yml'

permissions:
  contents: write

jobs:
  patch-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v6.1 patch
        run: python .github/scripts/patch_cw61.py
      - name: Validate syntax
        run: |
          node --check ContinueWatching.js
          node --check ContinueWatching-v6.1.js
      - name: Validate architecture
        run: |
          grep -q "v6.1.0-sync-metadata-ux-20260831" ContinueWatching.js
          grep -q "worker_storage" ContinueWatching.js
          grep -q "continue_watch_v6_outbox" ContinueWatching.js
          grep -q "Lampa.Player.playlist(list)" ContinueWatching.js
          grep -q "onlineDescriptor" ContinueWatching.js
          grep -q "button--continue-watch-native-just" ContinueWatching.js
          ! grep -q "39677" ContinueWatching.js
          ! grep -q "DDDTransport" ContinueWatching.js
      - name: Commit v6.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ContinueWatching.js ContinueWatching-v6.1.js
          git commit -m "Restore ContinueWatching UX metadata and reliable sync" || exit 0
          git push
