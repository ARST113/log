name: EAIS Spider-Man monitor

on:
  schedule:
    # 08:15 Moscow time (UTC+3). Moscow does not use DST.
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      films:
        description: 'Optional JSON array of EAIS film/project names; leave empty for defaults'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: eais-spiderman-monitor
  cancel-in-progress: false

env:
  EAIS_API_BASE: https://newgenres.duckdns.org/eais/api/v1

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build request
        id: request
        shell: bash
        env:
          INPUT_FILMS: ${{ github.event.inputs.films }}
        run: |
          set -euo pipefail
          DEFAULT_FILMS='["Прощание","Эй, человек!","Матч Акпарса","Соната","Три добрых дела","Сколько весит облако?","Край вдохновения","Авиарежим","Историю не изменить","Остановка","Рыжий очкарик","Снегур"]'
          if [ -n "${INPUT_FILMS:-}" ]; then
            FILMS="$INPUT_FILMS"
          else
            FILMS="$DEFAULT_FILMS"
          fi
          printf '%s' "$FILMS" | jq -e 'type == "array" and all(.[]; type == "string")' >/dev/null
          jq -n --argjson films "$FILMS" '{films:$films,output_format:"json",sleep_seconds:0}' > request.json
          echo "date_msk=$(TZ=Europe/Moscow date +%F)" >> "$GITHUB_OUTPUT"
          echo "stamp_msk=$(TZ=Europe/Moscow date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Check API health
        shell: bash
        env:
          API_KEY: ${{ secrets.NEWGENRES_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$API_KEY" || { echo 'Repository secret NEWGENRES_API_KEY is missing'; exit 1; }
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $API_KEY" \
            "$EAIS_API_BASE/health" > health.json || true

      - name: Create EAIS job
        id: create
        shell: bash
        env:
          API_KEY: ${{ secrets.NEWGENRES_API_KEY }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail --silent --show-error \
            -X POST "$EAIS_API_BASE/films/jobs" \
            -H "Authorization: Bearer $API_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary @request.json)
          printf '%s\n' "$RESPONSE" > job-created.json
          JOB_ID=$(printf '%s' "$RESPONSE" | jq -r '.id // .job_id // .job.id // empty')
          test -n "$JOB_ID" || { echo 'Could not extract EAIS job id'; cat job-created.json; exit 1; }
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Poll EAIS job
        shell: bash
        env:
          API_KEY: ${{ secrets.NEWGENRES_API_KEY }}
          JOB_ID: ${{ steps.create.outputs.job_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $API_KEY" \
              "$EAIS_API_BASE/jobs/$JOB_ID" > job-status.json
            STATUS=$(jq -r '.status // .state // empty' job-status.json | tr '[:upper:]' '[:lower:]')
            echo "EAIS status: ${STATUS:-unknown} (poll $i/120)"
            case "$STATUS" in
              completed|complete|done|finished|success|succeeded) exit 0 ;;
              failed|error|cancelled|canceled) cat job-status.json; exit 1 ;;
            esac
            sleep 10
          done
          echo 'Timed out waiting for EAIS job'
          cat job-status.json
          exit 1

      - name: Download JSON result
        shell: bash
        env:
          API_KEY: ${{ secrets.NEWGENRES_API_KEY }}
          JOB_ID: ${{ steps.create.outputs.job_id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $API_KEY" \
            -o result.json "$EAIS_API_BASE/jobs/$JOB_ID/result"
          jq empty result.json
          jq '{request,summary,counts:{films:(.data.films|length),daily_stats:(.data.daily_stats|length),daily_schedule:(.data.daily_schedule|length),hourly_schedule:(.data.hourly_schedule|length),errors:(.data.errors|length)}}' result.json > summary.json

      - name: Package dated snapshot
        shell: bash
        env:
          STAMP: ${{ steps.request.outputs.stamp_msk }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp request.json out/request.json
          cp job-created.json out/job-created.json
          cp job-status.json out/job-status.json
          cp result.json "out/eais-spiderman-${STAMP}-msk.json"
          cp summary.json "out/eais-spiderman-${STAMP}-msk-summary.json"

      - name: Upload EAIS JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: eais-spiderman-${{ steps.request.outputs.stamp_msk }}-msk
          path: out/
          retention-days: 90
          if-no-files-found: error
