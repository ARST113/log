name: Apply ContinueWatching v6 clean core

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cw6-clean.yml'

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate v6 syntax
        run: node --check ContinueWatching-v6.js
      - name: Validate architecture guards
        run: |
          ! grep -q '39677' ContinueWatching-v6.js
          ! grep -q 'DDDTransport' ContinueWatching-v6.js
          grep -q "Player.playlist(list)" ContinueWatching-v6.js
          grep -q "timelineView(record.timeline_hash" ContinueWatching-v6.js
          grep -q "continue_watch_v6" ContinueWatching-v6.js
      - name: Publish v6 as main
        run: cp ContinueWatching-v6.js ContinueWatching.js
      - name: Commit main plugin
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ContinueWatching.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rewrite ContinueWatching v6 from clean Lampa timeline core'
          git push
