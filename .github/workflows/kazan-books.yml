name: Collect Kazan 1940s books

on:
  workflow_dispatch:
  push:
    branches:
      - research/kazan-books-1940s
    paths:
      - .github/workflows/kazan-books.yml

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests PyMuPDF Pillow
      - name: Download and validate books
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import hashlib, json, time
          import requests, fitz
          from PIL import Image

          out=Path('kazan_books_1940s'); out.mkdir(exist_ok=True)
          diag=[]
          s=requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36',
              'Accept-Language':'ru-RU,ru;q=0.9,en;q=0.8',
              'DNT':'1',
          })

          def log(*x):
              z=' '.join(str(v) for v in x); print(z); diag.append(z)
          def req(url,**kw):
              r=s.get(url,timeout=120,allow_redirects=True,**kw)
              log('GET',url,'->',r.status_code,r.headers.get('content-type'),len(r.content),r.url)
              if r.status_code>=400:
                  try: log('BODY',r.text[:1200])
                  except Exception: pass
              return r
          def is_pdf(data): return len(data)>4 and data.lstrip().startswith(b'%PDF')
          def describe(path,title,source,url):
              data=path.read_bytes(); d=fitz.open(path)
              return {'title':title,'file':path.name,'source':source,'downloaded_from':url,'bytes':len(data),'pages_in_pdf':d.page_count,'sha256':hashlib.sha256(data).hexdigest()}

          records=[]
          # Book 1
          top=out/'Topuridze_Kazan_1945.pdf'; top_url='https://opac.tularlic.ru/opacg/Skaner/2021/262-85449-2021.pdf'
          r=req(top_url)
          if r.ok and is_pdf(r.content):
              top.write_bytes(r.content); records.append(describe(top,'К. Топуридзе. Казань. 1945','Тульская областная научная библиотека',r.url))
          else:
              raise RuntimeError('Topuridze download failed')

          # Book 2: try RSL/RusNEB viewer after priming browser session.
          docid='rsl01006036425'; tatar=out/'Tatarskaya_ASSR_v_gody_VOV_1948.pdf'; tatar_url=None
          hosts=['https://viewer.rsl.ru','https://viewer.rusneb.ru']
          for host in hosts:
              viewer=f'{host}/ru/{docid}?page=1&rotate=0&theme=white'
              vr=req(viewer,headers={'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8'})
              log('COOKIES',host,s.cookies.get_dict())
              for suffix in ['pdf','page/1']:
                  ar=req(f'{host}/api/v1/document/{docid}/{suffix}',headers={
                      'Referer':viewer,
                      'Origin':host,
                      'Accept':'application/pdf,image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
                      'X-Requested-With':'XMLHttpRequest',
                  })
                  if suffix=='pdf' and ar.ok and is_pdf(ar.content) and len(ar.content)>1_000_000:
                      tatar.write_bytes(ar.content); tatar_url=ar.url; break
              if tatar_url: break

          # RGO still worth trying with browser-like referer.
          if not tatar_url:
              rgo_view='https://elib.rgo.ru/handle/123456789/228071'
              req(rgo_view,headers={'Accept':'text/html,application/xhtml+xml,*/*;q=0.8'})
              rr=req('https://elib.rgo.ru/bitstream/123456789/228071/1/5884_Tatarskaya%20ASSR%20v%20gody%20Velikoi%20Otechestvennoi%20voin.pdf',headers={'Referer':rgo_view})
              if rr.ok and is_pdf(rr.content) and len(rr.content)>1_000_000:
                  tatar.write_bytes(rr.content); tatar_url=rr.url

          # If direct PDF is unavailable, attempt page reconstruction with the primed session.
          if not tatar_url:
              assembled=fitz.open(); chosen=None; page_count=0
              for n in range(1,230):
                  got=None
                  for host in ([chosen] if chosen else hosts):
                      viewer=f'{host}/ru/{docid}?page={n}&rotate=0&theme=white'
                      ar=req(f'{host}/api/v1/document/{docid}/page/{n}',headers={'Referer':viewer,'Origin':host,'Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8','X-Requested-With':'XMLHttpRequest'})
                      if not ar.ok: continue
                      data=ar.content; ct=ar.headers.get('content-type','').lower()
                      if ct.startswith('image/') or data[:2]==b'\xff\xd8' or data[:8].startswith(b'\x89PNG'):
                          got=(host,data); break
                      if is_pdf(data):
                          d=fitz.open(stream=data,filetype='pdf'); assembled.insert_pdf(d); got=(host,None); break
                  if not got:
                      if n==1: break
                      else: break
                  chosen=got[0]
                  if got[1] is not None:
                      im=Image.open(BytesIO(got[1])); w,h=im.size; p=assembled.new_page(width=w,height=h); p.insert_image(p.rect,stream=got[1])
                  page_count+=1
                  if n%20==0: log('ASSEMBLED',n)
                  time.sleep(.03)
              log('RECONSTRUCTED_PAGES',page_count)
              if page_count>=150:
                  assembled.save(tatar,garbage=4,deflate=True); tatar_url=f'{chosen}/api/v1/document/{docid}/page/{{n}}'

          if tatar_url and tatar.exists():
              records.append(describe(tatar,'Татарская АССР в годы Великой Отечественной войны. 1948','РГБ/НЭБ или РГО',tatar_url))
          else:
              records.append({'title':'Татарская АССР в годы Великой Отечественной войны. 1948','status':'source exposed, binary blocked from GitHub runner','rsl_id':docid,'rgo_handle':'123456789/228071'})

          (out/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'diagnostics.txt').write_text('\n'.join(diag),encoding='utf-8')
          print('MANIFEST',json.dumps(records,ensure_ascii=False,indent=2))
          PY
      - name: Upload collected books
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazan-books-1940s
          path: kazan_books_1940s/
          if-no-files-found: error
          retention-days: 30
