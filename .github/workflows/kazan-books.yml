name: Collect Kazan 1940s books

on:
  workflow_dispatch:
  push:
    branches:
      - research/kazan-books-1940s
    paths:
      - .github/workflows/kazan-books.yml

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 PyMuPDF
      - name: Download and validate books
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin, quote
          import hashlib, json, re
          import requests
          from bs4 import BeautifulSoup
          import fitz

          out = Path('kazan_books_1940s')
          out.mkdir(exist_ok=True)
          s = requests.Session()
          s.headers.update({'User-Agent': 'Mozilla/5.0 archival-research/1.0'})

          def save_pdf(url, path, *, min_bytes=100_000):
              print('GET', url)
              r = s.get(url, timeout=120, allow_redirects=True)
              print(' ->', r.status_code, r.headers.get('content-type'), len(r.content), r.url)
              r.raise_for_status()
              data = r.content
              if len(data) < min_bytes or not data.lstrip().startswith(b'%PDF'):
                  raise RuntimeError(f'Not a PDF: {url} ({len(data)} bytes, {data[:30]!r})')
              path.write_bytes(data)
              return r.url

          records = []

          # 1) K. Topuridze, Kazan, 1945 — Tula Regional Scientific Library.
          top_path = out / 'Topuridze_Kazan_1945.pdf'
          top_urls = [
              'https://opac.tularlic.ru/opacg/Skaner/2021/262-85449-2021.pdf',
              'http://opac.tularlic.ru/opacg/Skaner/2021/262-85449-2021.pdf',
          ]
          top_final = None
          top_errors = []
          for u in top_urls:
              try:
                  top_final = save_pdf(u, top_path, min_bytes=500_000)
                  break
              except Exception as e:
                  top_errors.append(f'{u}: {e}')
          if top_final is None:
              raise RuntimeError('Topuridze download failed:\n' + '\n'.join(top_errors))

          # 2) Tatar ASSR during the Great Patriotic War, Kazan, 1948 — RGO library.
          rgo_path = out / 'Tatarskaya_ASSR_v_gody_VOV_1948.pdf'
          handle = 'https://elib.rgo.ru/handle/123456789/228071'
          rgo_candidates = []

          # HTML discovery (works with older DSpace front-ends).
          try:
              hr = s.get(handle, timeout=60)
              print('HANDLE', hr.status_code, hr.url, len(hr.content))
              if hr.ok:
                  soup = BeautifulSoup(hr.text, 'html.parser')
                  for a in soup.find_all('a', href=True):
                      href = urljoin(hr.url, a['href'])
                      txt = (a.get_text(' ', strip=True) or '').lower()
                      if '.pdf' in href.lower() or '/bitstream/' in href.lower() or '5884_' in href or '.pdf' in txt:
                          rgo_candidates.append(href)
                  # raw regex fallback
                  for m in re.findall(r'''(?:href|src)=["']([^"']+(?:\.pdf|bitstream)[^"']*)["']''', hr.text, flags=re.I):
                      rgo_candidates.append(urljoin(hr.url, m))
          except Exception as e:
              print('HTML discovery failed:', repr(e))

          # DSpace 7 REST discovery via persistent identifier.
          try:
              pid = s.get('https://elib.rgo.ru/server/api/pid/find', params={'id':'123456789/228071'}, timeout=60, headers={'Accept':'application/json'})
              print('PID API', pid.status_code, pid.url, pid.text[:200])
              if pid.ok and 'json' in pid.headers.get('content-type','').lower():
                  item = pid.json()
                  bundles_url = item.get('_links',{}).get('bundles',{}).get('href')
                  if bundles_url:
                      br = s.get(bundles_url, timeout=60, headers={'Accept':'application/json'}); br.raise_for_status()
                      bundles = br.json().get('_embedded',{}).get('bundles',[])
                      for bundle in bundles:
                          bit_url = bundle.get('_links',{}).get('bitstreams',{}).get('href')
                          if not bit_url: continue
                          rr = s.get(bit_url, timeout=60, headers={'Accept':'application/json'}); rr.raise_for_status()
                          for bit in rr.json().get('_embedded',{}).get('bitstreams',[]):
                              name = bit.get('name','')
                              if name.lower().endswith('.pdf') or '5884_' in name:
                                  content = bit.get('_links',{}).get('content',{}).get('href')
                                  if content: rgo_candidates.insert(0, content)
          except Exception as e:
              print('REST discovery failed:', repr(e))

          # Known DSpace 6-style fallback URL derived from the public handle and filename.
          fname = '5884_Tatarskaya ASSR v gody Velikoi Otechestvennoi voin.pdf'
          rgo_candidates += [
              'https://elib.rgo.ru/bitstream/123456789/228071/1/' + quote(fname),
              'https://elib.rgo.ru/bitstream/123456789/228071/1/' + quote(fname) + '?sequence=1&isAllowed=y',
          ]

          # De-duplicate while preserving order.
          seen = set(); rgo_candidates = [u for u in rgo_candidates if not (u in seen or seen.add(u))]
          print('RGO candidates:', json.dumps(rgo_candidates, ensure_ascii=False, indent=2))
          rgo_final = None
          rgo_errors = []
          for u in rgo_candidates:
              try:
                  rgo_final = save_pdf(u, rgo_path, min_bytes=1_000_000)
                  break
              except Exception as e:
                  rgo_errors.append(f'{u}: {e}')
          if rgo_final is None:
              raise RuntimeError('RGO download failed:\n' + '\n'.join(rgo_errors))

          def describe(path, title, source, final_url):
              data = path.read_bytes()
              doc = fitz.open(path)
              return {
                  'title': title,
                  'file': path.name,
                  'source': source,
                  'downloaded_from': final_url,
                  'bytes': len(data),
                  'pages_in_pdf': doc.page_count,
                  'sha256': hashlib.sha256(data).hexdigest(),
              }

          records.append(describe(top_path, 'К. Топуридзе. Казань. 1945', 'Тульская областная научная библиотека', top_final))
          records.append(describe(rgo_path, 'Татарская АССР в годы Великой Отечественной войны. 1948', 'Библиотека Русского географического общества', rgo_final))
          (out/'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(records, ensure_ascii=False, indent=2))
          PY
      - name: Upload collected books
        uses: actions/upload-artifact@v4
        with:
          name: kazan-books-1940s
          path: kazan_books_1940s/
          retention-days: 30
