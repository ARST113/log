name: Update VK group descriptions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: update-vk-profiles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VK_TOKEN: ${{ secrets.VKKEY }}
      VK_API_VERSION: "5.199"
    steps:
      - uses: actions/checkout@v4

      - name: Build verified VK database
        run: python3 scripts/update_vk_profiles.py

      - name: Commit generated database
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ff2026-vk.js vk-search-report.json
          if git diff --cached --quiet; then
            echo "VK database has not changed."
            exit 0
          fi
          git commit -m "Update VK descriptions for FF 2026"
          git push
