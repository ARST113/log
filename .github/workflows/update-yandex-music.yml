name: Update Yandex Music links

on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-yandex-music.yml"
      - "scripts/update_yandex_music.py"
      - "ym-artists-map.json"
      - "ff2026-data-*.js"

permissions:
  contents: write

concurrency:
  group: update-yandex-music
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Yandex Music client
        run: python -m pip install --upgrade "yandex-music==3.0.0"

      - name: Build Yandex Music links
        run: python scripts/update_yandex_music.py

      - name: Commit generated database
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ff2026-yandex.json ym-search-report.json
          if git diff --cached --quiet; then
            echo "Yandex Music database has not changed."
            exit 0
          fi
          git commit -m "Update Yandex Music links for FF 2026"
          git push
