        <rect class="hit" x="1050" y="500" width="290" height="190" rx="18"/><use href="#tent" x="1065" y="515" width="115" height="80"/><use href="#tent" x="1160" y="550" width="105" height="73"/><use href="#tent" x="1240" y="508" width="110" height="77"/><use href="#campfire" x="1115" y="610" width="65" height="65"/>

<div class="zone-card" id="zoneCard"><b id="zoneNumber">1</b><span id="zoneLabel">Парковка 1</span></div>
<button class="reset" id="reset" type="button" aria-label="Вернуть исходный вид">⌖</button>
<script>
(()=>{
  'use strict';
  const WORLD_W=1536,WORLD_H=900,START_ZOOM=1.08,MAX_ZOOM=3.5;
  const viewport=document.getElementById('viewport');
  const stage=document.getElementById('stage');
  const reset=document.getElementById('reset');
  const zoneCard=document.getElementById('zoneCard');
  const zoneNumber=document.getElementById('zoneNumber');
  const zoneLabel=document.getElementById('zoneLabel');
  const state={fit:1,scale:1,x:0,y:0};
  const pointers=new Map();
  let drag=null,pinch=null,frame=0,moved=false,selected=null;

  const cover=()=>Math.max(viewport.clientWidth/WORLD_W,viewport.clientHeight/WORLD_H);
  const maxScale=()=>state.fit*MAX_ZOOM;
  function clamp(){
    const vw=viewport.clientWidth,vh=viewport.clientHeight,sw=WORLD_W*state.scale,sh=WORLD_H*state.scale;
    const minX=vw-sw,minY=vh-sh;
    state.x=sw<=vw?(vw-sw)/2:Math.max(minX,Math.min(0,state.x));
    state.y=sh<=vh?(vh-sh)/2:Math.max(minY,Math.min(0,state.y));
  }
  function applyNow(){frame=0;clamp();stage.style.transform=`translate3d(${state.x}px,${state.y}px,0) scale(${state.scale})`}
  function apply(){if(!frame)frame=requestAnimationFrame(applyNow)}
  function center(scale=state.fit*START_ZOOM,nx=.5,ny=.49){
    state.scale=Math.max(state.fit,Math.min(maxScale(),scale));
    state.x=viewport.clientWidth/2-WORLD_W*nx*state.scale;
    state.y=viewport.clientHeight/2-WORLD_H*ny*state.scale;
    apply();
  }
  function fit(preserve=false){
    const oldFit=state.fit||1;
    const nx=(viewport.clientWidth/2-state.x)/(WORLD_W*state.scale)||.5;
    const ny=(viewport.clientHeight/2-state.y)/(WORLD_H*state.scale)||.49;
    const ratio=state.scale/oldFit;
    state.fit=cover();
    center(preserve?state.fit*ratio:state.fit*START_ZOOM,preserve?nx:.5,preserve?ny:.49);
  }
  function zoomAt(target,clientX,clientY){
    const rect=viewport.getBoundingClientRect(),px=clientX-rect.left,py=clientY-rect.top;
    const next=Math.max(state.fit,Math.min(maxScale(),target));
    const cx=(px-state.x)/state.scale,cy=(py-state.y)/state.scale;
    state.x=px-cx*next;state.y=py-cy*next;state.scale=next;
    viewport.classList.add('used');apply();
  }
  viewport.addEventListener('pointerdown',event=>{
    moved=false;
    viewport.setPointerCapture?.(event.pointerId);
    pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
    if(pointers.size===1)drag={x:event.clientX,y:event.clientY,mapX:state.x,mapY:state.y};
    else if(pointers.size===2){
      const[a,b]=[...pointers.values()];
      pinch={distance:Math.hypot(a.x-b.x,a.y-b.y),scale:state.scale,x:state.x,y:state.y,midX:(a.x+b.x)/2,midY:(a.y+b.y)/2};
    }
  });
  viewport.addEventListener('pointermove',event=>{
    if(!pointers.has(event.pointerId))return;
    const prev=pointers.get(event.pointerId);
    if(Math.hypot(event.clientX-prev.x,event.clientY-prev.y)>2)moved=true;
    pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
    viewport.classList.add('used');
    if(pointers.size===2&&pinch){
      const[a,b]=[...pointers.values()],distance=Math.hypot(a.x-b.x,a.y-b.y),midX=(a.x+b.x)/2,midY=(a.y+b.y)/2;
      const rect=viewport.getBoundingClientRect(),sx=pinch.midX-rect.left,sy=pinch.midY-rect.top;
      const cx=(sx-pinch.x)/pinch.scale,cy=(sy-pinch.y)/pinch.scale;
      state.scale=Math.max(state.fit,Math.min(maxScale(),pinch.scale*distance/Math.max(1,pinch.distance)));
      state.x=midX-rect.left-cx*state.scale;state.y=midY-rect.top-cy*state.scale;apply();
    }else if(pointers.size===1&&drag){
      state.x=drag.mapX+(event.clientX-drag.x);state.y=drag.mapY+(event.clientY-drag.y);apply();
    }
  });
  function end(event){
    pointers.delete(event.pointerId);
    if(pointers.size===1){const point=[...pointers.values()][0];drag={x:point.x,y:point.y,mapX:state.x,mapY:state.y}}else drag=null;
    pinch=null;
  }
  viewport.addEventListener('pointerup',end);
  viewport.addEventListener('pointercancel',end);
  viewport.addEventListener('wheel',event=>{event.preventDefault();zoomAt(state.scale*(event.deltaY<0?1.12:.9),event.clientX,event.clientY)},{passive:false});
  viewport.addEventListener('dblclick',event=>{event.preventDefault();zoomAt(state.scale<state.fit*1.8?state.scale*1.45:state.fit*START_ZOOM,event.clientX,event.clientY)});
  reset.addEventListener('click',()=>center(state.fit*START_ZOOM,.5,.49));
  document.querySelectorAll('.zone').forEach(zone=>{
    const show=()=>{
      if(selected)selected.classList.remove('is-selected');
      selected=zone;zone.classList.add('is-selected');
      zoneNumber.textContent=zone.dataset.zone;zoneLabel.textContent=zone.dataset.label;zoneCard.classList.add('is-visible');
    };
    zone.addEventListener('click',event=>{event.stopPropagation();if(!moved)show()});
    zone.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();show()}});
  });
  viewport.addEventListener('click',event=>{
    if(event.target.closest('.zone')||moved)return;
    if(selected)selected.classList.remove('is-selected');selected=null;zoneCard.classList.remove('is-visible');
  });
  new ResizeObserver(()=>fit(true)).observe(viewport);
  fit(false);
})();
</script>
</body>
</html>
